name: Apply V4 history import helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/v4-history-import-helper-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-history-import-helper-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply history helper patch
        run: node scripts/apply-v4-history-import-helper.mjs
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Commit functional UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html tests/v4-history-import-helper.test.js
          git commit -m "feat: add V4 historical import helper"
      - name: Remove one-time tooling
        run: |
          rm -f scripts/apply-v4-history-import-helper.mjs .github/workflows/apply-v4-history-import-helper.yml
          git add -A
          git commit -m "chore: remove V4 history helper tooling"
      - name: Push
        run: git push origin HEAD:feat/v4-history-import-helper-20260820
