name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Validate every PR and main update without long-lived build artifacts.

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Node tests
        run: npm test
      - name: Distributor database integration
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/work" -w /work \
            postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/distributor-foundation.integration.sql
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/work" -w /work \
            postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/distributor-safe-copy.integration.sql
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/work" -w /work \
            postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/distributor-fidelity.integration.sql
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/work" -w /work \
            postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/distributor-synthetic-pilot.integration.sql
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD:/work" -w /work \
            postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f tests/distributor-index-pin.integration.sql
      - name: JavaScript syntax
        run: npm run check
      - name: Isolated E2E harness syntax and Docker configuration
        run: |
          node --check scripts/e2e-local/run-distributor.mjs
          node --check scripts/e2e-local/set-webhook.mjs
          node --check scripts/e2e-local/verify-two-test-bot-access.mjs
          E2E_DB_CONTAINER_NAME=tgcloner-e2e-1to2-db \
          E2E_REST_CONTAINER_NAME=tgcloner-e2e-1to2-rest \
          E2E_DB_HOST_PORT=55555 E2E_POSTGREST_PORT=55556 \
            docker compose -p tgcloner-e2e-1to2 -f scripts/e2e-local/docker-compose.yml config > /dev/null
      - name: Clone configuration isolation
        run: npm run check:clone
      - name: Python syntax
        run: |
          python -m py_compile reader-cli/export_history.py
          python -m py_compile reader-cli/course_full.py scripts/e2e-local/inventory-course.py
          python -m py_compile scripts/e2e-local/inspect-two-destinations.py scripts/e2e-local/verify-two-resume.py scripts/e2e-local/verify_telegram.py
          python -m py_compile reader-cli/reconcile_history.py
          python -m py_compile reader-cli/reader_agent.py
          python -m py_compile reader-cli/mirror_v5_r2.py
          python -m py_compile reader-manager/reader_manager_agent.py
          python -m py_compile reader-manager/reader_manager_gui.py
          python -m py_compile reader-manager/reader_manager_storage.py
      - name: Reader watchdog, profile recovery, and photo tests
        run: |
          python -m unittest discover -s tests -p 'test_reader_*.py'
          python -m unittest discover -s tests -p 'test_course_full.py'
      - name: Secret hygiene
        shell: bash
        run: |
          test ! -e .env
          test ! -e .env.local
          ! find . -type f -name '*.session*' -print -quit | grep -q .
          ! find reader-cli -type f \( -name '*.part' -o -name '*.r2.json' \) -print -quit | grep -q .
          ! grep -RInE '(sb_secret_[A-Za-z0-9_-]{20,}|[0-9]{6,}:[A-Za-z0-9_-]{30,})' . \
            --exclude-dir=.git --exclude='.env.example'
