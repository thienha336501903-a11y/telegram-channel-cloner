name: Temporary Preview Media E2E

on:
  push:
    branches:
      - agent/safari-video-startup
    paths:
      - .github/workflows/preview-media-e2e.yml

permissions:
  contents: read
  id-token: write

jobs:
  preview-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify Bot and MTProto Preview startup
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          LMS_ORIGIN: https://yeunauan-lms-git-5b4b00-thienha100022653824678-stacks-projects.vercel.app
          CLONER_ORIGIN: https://telegram-chan-git-f8c885-thienha100022653824678-stacks-projects.vercel.app
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          trusted=(-H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN")
          curl -sS --fail "${trusted[@]}" \
            -H 'X-LMS-Session-Id: __clone_factory_test_lms_mobile_perf_20260815' \
            -H 'X-LMS-Device-Id: __clone_factory_test_lms_device_20260815' \
            -H 'User-Agent: __clone_factory_test Safari iOS' \
            "$LMS_ORIGIN/api/lms/portal?endpoint=v4-telegram-feed&course=cagiatay" \
            -o "$work_dir/feed.json"

          WORK_DIR="$work_dir" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const feed = JSON.parse(fs.readFileSync(path.join(process.env.WORK_DIR, 'feed.json'), 'utf8'));
          if (!feed.success || feed.posts?.length !== 14) throw new Error('feed validation failed');
          const targets = {
            bot: feed.posts.find((post) => post.media?.delivery === 'telegram_gateway_bot'),
            mtproto: feed.posts.find((post) => post.media?.delivery === 'telegram_gateway_mtproto')
          };
          for (const [name, post] of Object.entries(targets)) {
            if (!post?.media?.url) throw new Error(`missing ${name} target`);
            const play = new URL(post.media.url);
            const prepare = new URL(post.media.url);
            for (const url of [play, prepare]) {
              url.protocol = 'https:';
              url.host = new URL(process.env.CLONER_ORIGIN).host;
            }
            prepare.searchParams.set('prepare', '1');
            fs.writeFileSync(path.join(process.env.WORK_DIR, `${name}.play`), play.toString(), { mode: 0o600 });
            fs.writeFileSync(path.join(process.env.WORK_DIR, `${name}.prepare`), prepare.toString(), { mode: 0o600 });
          }
          NODE

          request() {
            local name="$1" url_file="$2" range="${3:-}"
            local args=(-sS --fail "${trusted[@]}" -D "$work_dir/$name.headers" -o "$work_dir/$name.body" -w '%{time_starttransfer} %{time_total}')
            if [[ -n "$range" ]]; then args+=(-H "Range: $range"); fi
            curl "${args[@]}" "$(<"$url_file")" > "$work_dir/$name.time"
          }

          for transport in bot mtproto; do
            request "$transport-prepare-1" "$work_dir/$transport.prepare"
            request "$transport-prepare-2" "$work_dir/$transport.prepare"
            request "$transport-probe" "$work_dir/$transport.play" 'bytes=0-1'
            request "$transport-play" "$work_dir/$transport.play" 'bytes=0-262143'
          done

          WORK_DIR="$work_dir" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function headers(name) {
            const raw = fs.readFileSync(path.join(process.env.WORK_DIR, `${name}.headers`), 'utf8');
            const blocks = raw.split(/\r?\n\r?\n/).filter((block) => /^HTTP\//m.test(block));
            const lines = blocks.at(-1).split(/\r?\n/);
            const status = Number(lines[0].split(/\s+/)[1]);
            const values = Object.fromEntries(lines.slice(1).flatMap((line) => {
              const at = line.indexOf(':');
              return at > 0 ? [[line.slice(0, at).toLowerCase(), line.slice(at + 1).trim()]] : [];
            }));
            return { status, values };
          }
          function body(name) { return fs.readFileSync(path.join(process.env.WORK_DIR, `${name}.body`)); }
          function timing(name) {
            const [ttfb, total] = fs.readFileSync(path.join(process.env.WORK_DIR, `${name}.time`), 'utf8').trim().split(/\s+/).map(Number);
            return { ttfbMs: Math.round(ttfb * 1000), totalMs: Math.round(total * 1000) };
          }
          const summary = {};
          for (const transport of ['bot', 'mtproto']) {
            const first = headers(`${transport}-prepare-1`);
            const second = headers(`${transport}-prepare-2`);
            const probe = headers(`${transport}-probe`);
            const play = headers(`${transport}-play`);
            const probeBody = body(`${transport}-probe`);
            const playBody = body(`${transport}-play`);
            if (first.status !== 204 || second.status !== 204) throw new Error(`${transport} prepare did not return 204`);
            if (first.values['x-mp4-layout'] !== 'virtual-faststart') throw new Error(`${transport} prepare layout invalid`);
            if (!['memory', 'runtime'].includes(second.values['x-mp4-index-cache'])) throw new Error(`${transport} second prepare missed cache`);
            if (probe.status !== 206 || probe.values['x-mp4-layout'] !== 'probe-passthrough' || probe.values['x-mp4-index-cache'] !== 'skipped-probe' || probeBody.length !== 2) throw new Error(`${transport} Safari probe invalid`);
            if (play.status !== 206 || play.values['x-mp4-layout'] !== 'virtual-faststart' || playBody.length !== 262144) throw new Error(`${transport} playback range invalid`);
            const text = playBody.toString('latin1');
            if (!text.includes('ftyp') || !text.includes('moov')) throw new Error(`${transport} first range is not fast-start MP4`);
            summary[transport] = {
              prepare1Cache: first.values['x-mp4-index-cache'],
              prepare2Cache: second.values['x-mp4-index-cache'],
              prepare1: timing(`${transport}-prepare-1`),
              prepare2: timing(`${transport}-prepare-2`),
              probe: timing(`${transport}-probe`),
              play: timing(`${transport}-play`)
            };
          }
          console.log(JSON.stringify(summary));
          NODE
