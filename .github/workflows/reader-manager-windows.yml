name: Reader Manager Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reader-manager/**'
      - 'reader-cli/**'
      - '.github/workflows/reader-manager-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build installer
        shell: powershell
        run: ./reader-manager/build.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YeuNauAnReaderSetup
          path: reader-manager/Output/YeuNauAnReaderSetup.exe
