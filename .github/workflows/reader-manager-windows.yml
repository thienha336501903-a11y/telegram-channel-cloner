name: Reader Manager Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reader-manager/**'
      - 'reader-cli/**'
      - '.github/workflows/reader-manager-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build installer
        shell: powershell
        run: ./reader-manager/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: YeuNauAnReaderSetup
          path: reader-manager/Output/YeuNauAnReaderSetup.exe
