name: Reader Manager Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reader-manager/**'
      - 'reader-cli/**'
      - '.github/workflows/reader-manager-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installer
        shell: powershell
        run: ./reader-manager/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: YeuNauAnReaderSetup
          path: reader-manager/Output/YeuNauAnReaderSetup.exe
