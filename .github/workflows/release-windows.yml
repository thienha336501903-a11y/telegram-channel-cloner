name: Reader Windows Release

on:
  push:
    tags:
      - "reader-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. reader-v1.4.12"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: reader-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build installer
        shell: powershell
        run: ./reader-manager/build.ps1

      - name: Verify version, cryptg, and installer
        shell: pwsh
        run: |
          if (-not (Test-Path "reader-manager/Output/YeuNauAnReaderSetup.exe")) { throw "Installer missing" }
          $version = python -c "import sys; sys.path.insert(0, 'reader-manager'); import reader_manager_agent; print(reader_manager_agent.APP_VERSION)"
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $expectedTag = "reader-v$($version.Trim())"
          if ($tag -ne $expectedTag) { throw "Release tag $tag does not match Reader version $expectedTag" }
          $crypto = & "reader-manager/dist/YeuNauAnReaderMirror.exe" --check-crypto
          Write-Host $crypto
          if (($crypto | Out-String) -notmatch "CRYPTO_BACKEND=cryptg") { throw "Packaged mirror is not using cryptg" }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash "reader-manager/Output/YeuNauAnReaderSetup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  YeuNauAnReaderSetup.exe" | Set-Content -Path "reader-manager/Output/SHA256SUMS.txt" -Encoding ascii
          Write-Host "SETUP_SHA256=$hash"

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists: $tag" }
          gh release create $tag "reader-manager/Output/YeuNauAnReaderSetup.exe#YeuNauAnReaderSetup.exe" "reader-manager/Output/SHA256SUMS.txt#SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Yêu Nấu Ăn Reader $($tag.Replace('reader-v',''))" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,targetCommitish,assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names -notcontains "YeuNauAnReaderSetup.exe") { throw "Release installer missing" }
          if ($names -notcontains "SHA256SUMS.txt") { throw "Release SHA manifest missing" }
