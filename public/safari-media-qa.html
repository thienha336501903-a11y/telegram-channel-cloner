<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Safari Media QA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#15232d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #dce5ea;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px rgba(30,55,70,.08)}h1{font-size:21px;margin:0 0 6px}p{font-size:13px;line-height:1.5;color:#647581}button{width:100%;min-height:48px;border:0;border-radius:12px;background:#1677ff;color:#fff;font-weight:800;font-size:15px}button:disabled{opacity:.45}video{width:100%;margin-top:12px;background:#111;border-radius:12px;aspect-ratio:16/9}.status{font-size:13px;line-height:1.55;margin-top:10px;white-space:pre-wrap}.ok{color:#197346;font-weight:800}.bad{color:#b42318;font-weight:800}.warm{color:#945d00;font-weight:800}.muted{font-size:11px;color:#80909a}</style>
</head>
<body><div class="wrap">
<h1>iPhone Safari prewarmed video QA</h1>
<p>Trang sẽ chuẩn bị MP4 metadata trước. Chỉ bấm Test Play sau khi từng ô báo PREPARE READY.</p>
<div id="bot" class="card"></div>
<div id="mtproto" class="card"></div>
<div class="card"><div class="muted">Sau khi test xong cả hai, quay lại ChatGPT và chỉ cần nhắn: <b>QA warm xong</b>.</div></div>
</div>
<script>
(()=>{
 const qs=new URLSearchParams(location.search);
 const tests=[
  {id:'bot',name:'BOT API ~19.7 MB',src:'/api/telegram/media?ticket='+encodeURIComponent(qs.get('bot')||'')},
  {id:'mtproto',name:'MTProto ~25.1 MB',src:'/api/telegram/warmup?stream=1&ticket='+encodeURIComponent(qs.get('mtproto')||'')}
 ];
 const withPrepare=(src)=>src+(src.includes('?')?'&':'?')+'prepare=1';
 function sendMetric(t,ms){
  const end=Math.max(2,Math.min(999999,Math.round(ms)));
  fetch(t.src,{method:'HEAD',headers:{Range:`bytes=1-${end}`},cache:'no-store',credentials:'same-origin'}).catch(()=>{});
 }
 async function diagnose(t){
  try{
   const r=await fetch(t.src,{headers:{Range:'bytes=0-1'},cache:'no-store',credentials:'same-origin'});
   let detail='';
   if(!r.ok){try{const data=await r.json();detail=data?.error?` / ${data.error}`:''}catch{}}
   return `HTTP ${r.status}${detail}`;
  }catch(err){return `HTTP diagnostic failed: ${err?.message||err}`}
 }
 function setup(t){
  const root=document.getElementById(t.id);
  root.innerHTML=`<strong>${t.name}</strong><div class="muted">Đo Play → playing sau khi prepare hoàn tất.</div><div class="status warm">Đang PREPARE…</div><button type="button" disabled>Đang chuẩn bị…</button><video controls playsinline preload="none"></video><div class="status result">Chưa chạy.</div>`;
  const btn=root.querySelector('button'),v=root.querySelector('video'),prepStatus=root.querySelector('.warm'),s=root.querySelector('.result');
  let t0=0,done=false,diagnosing=false,events=[];
  const render=()=>{s.textContent=events.join('\n')};
  const log=(name)=>{if(!t0)return;const ms=Math.round(performance.now()-t0);events.push(`${name}: ${ms} ms`);render()};
  async function prepare(){
   const p0=performance.now();
   try{
    const r=await fetch(withPrepare(t.src),{method:'HEAD',cache:'no-store',credentials:'same-origin'});
    const ms=Math.round(performance.now()-p0);
    const layout=r.headers.get('x-mp4-layout')||'n/a';
    const cache=r.headers.get('x-mp4-index-cache')||'n/a';
    if(!r.ok){
     let detail='';try{const data=await r.json();detail=data?.error?` / ${data.error}`:''}catch{}
     prepStatus.innerHTML=`<span class="bad">PREPARE FAIL — HTTP ${r.status}${detail}</span>`;
     btn.textContent='Prepare lỗi';return;
    }
    prepStatus.innerHTML=`<span class="ok">PREPARE READY sau ${ms} ms</span>\nlayout=${layout} cache=${cache}`;
    btn.disabled=false;btn.textContent='▶ Test Play';
   }catch(err){prepStatus.innerHTML=`<span class="bad">PREPARE FAIL — ${err?.message||err}</span>`}
  }
  async function showFailure(reason){
   if(diagnosing)return;diagnosing=true;
   const ms=Math.round(performance.now()-t0);
   const http=await diagnose(t);
   const expired=/HTTP 403/.test(http);
   s.innerHTML=`<span class="bad">${expired?'TICKET HẾT HẠN / KHÔNG HỢP LỆ':'KHÔNG PHÁT ĐƯỢC'} — ${http}</span>\n${reason}: ${ms} ms\n`+events.join('\n');
   btn.disabled=false;diagnosing=false;
  }
  ['loadstart','loadedmetadata','loadeddata','canplay','waiting','stalled','suspend'].forEach(ev=>v.addEventListener(ev,()=>log(ev)));
  v.addEventListener('error',()=>{log('error');showFailure('media error')});
  v.addEventListener('playing',()=>{log('playing');if(!done){done=true;const ms=Math.round(performance.now()-t0);s.innerHTML=`<span class="ok">PLAYING sau ${ms} ms</span>\n`+events.join('\n');sendMetric(t,ms);btn.disabled=false;btn.textContent='↻ Test lại'}});
  btn.addEventListener('click',()=>{
   try{v.pause()}catch{}
   v.removeAttribute('src');v.load();
   events=[];done=false;diagnosing=false;t0=performance.now();btn.disabled=true;s.textContent='Đang đo…';
   v.src=t.src;v.load();
   const p=v.play();if(p&&p.catch)p.catch(err=>{log('play rejected: '+(err?.message||err));showFailure('play rejected')});
   setTimeout(()=>{if(!done&&!diagnosing){showFailure('timeout 12s')}},12000);
  });
  prepare();
 }
 tests.forEach(setup);
})();
</script></body></html>
